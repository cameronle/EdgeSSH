# Staging Worker configuration. Uses isolated D1 and Durable Object state.
name = "edgessh-staging"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "ssh-staging.865455.xyz", custom_domain = true }
]

[build]
command = "npm run build:web"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
CONNECT_TIMEOUT_MS = "10000"

[[durable_objects.bindings]]
name = "SSH_SESSIONS"
class_name = "SSHSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSHSessionDO"]

[[d1_databases]]
binding = "DB"
database_name = "edgessh-staging-accounts"
database_id = "d7ecdc6a-d5de-4cd6-aeeb-6358b8c80b6d"
migrations_dir = "migrations"
